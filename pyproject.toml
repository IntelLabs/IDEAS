[project]
name = "ideas"
version = "2026.10"
description = "Improved Decoding and Equivalence Automated testing at Scale"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = "~=3.13.0"

dependencies = [
    "clang==21.1.7",
    "json-repair==0.60.1",
    "hydra-core==1.3.8",
    "networkx==3.6.1",
    "rich==14.3.3",
    "tomlkit==0.14.0",
    "tree-sitter==0.25.2",
    "tree-sitter-rust-orchard==0.16.8",
]

[dependency-groups]
dev = [
    "basedpyright==1.29.4",
    "pre-commit==4.2.0",
    "pytest==9.0.3",
    "pytest-xdist==3.8.0",
    "ruff==0.13.0",
    "vulture==2.16",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
deprecateTypingAliases = true
reportDeprecated = true
reportPrivateImportUsage = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]

[tool.ruff]
line-length = 96
# Runs standalone under uv before the project environment exists (see its header)
per-file-target-version = { "src/ideas/sandbox.py" = "py311" }

[tool.uv]
# Ensure that the setuptools v81.0.0 is used whenever a package has a build dependency
# on setuptools.
build-constraint-dependencies = ["setuptools==81.0.0"]
