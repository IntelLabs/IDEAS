[workspace]
resolver = "3"
members = ["example"]

[workspace.dependencies]
flate2 = "=1.1.10"
libc = "=0.2.189"
openssl = "=0.10.81"
regex = "=1.13.1"
rustix = "=1.1.5"

assert_cmd = "=2.2.2"
insta = { version = "=1.48.0", features = ["json"] }
predicates = "=3.1.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
walkdir = "=2.5.0"

cc = "=1.4.7"
